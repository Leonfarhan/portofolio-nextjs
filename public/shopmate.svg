<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20" />
      <stop offset="100%" stop-color="#06040A" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="24" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="798" height="448" rx="23" stroke="#312E81" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Glowing background blobs -->
  <circle cx="200" cy="200" r="180" fill="url(#purple-glow)" filter="blur(60px)"/>
  <circle cx="650" cy="250" r="150" fill="url(#purple-glow)" filter="blur(50px)"/>

  <!-- Tech Grid Pattern -->
  <g opacity="0.15">
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400" stroke="#6366F1" stroke-width="1"/>
    <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450" stroke="#6366F1" stroke-width="1"/>
  </g>

  <!-- Central Dashboard Mockup -->
  <g transform="translate(180, 70)">
    <!-- Main Window -->
    <rect width="440" height="280" rx="16" fill="#11101D" stroke="#312E81" stroke-width="3"/>
    
    <!-- Window Header -->
    <rect width="440" height="35" rx="16" fill="#1E1B30"/>
    <rect y="19" width="440" height="16" fill="#1E1B30"/>
    <circle cx="20" cy="17" r="5" fill="#EF4444" />
    <circle cx="35" cy="17" r="5" fill="#F59E0B" />
    <circle cx="50" cy="17" r="5" fill="#10B981" />
    <text x="220" y="22" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF" text-anchor="middle" font-weight="600">shopmate.store</text>

    <!-- Sidebar -->
    <rect x="10" y="45" width="80" height="225" rx="8" fill="#161426"/>
    <rect x="20" y="60" width="60" height="12" rx="4" fill="#312E81"/>
    <rect x="20" y="85" width="60" height="12" rx="4" fill="#1E1B30"/>
    <rect x="20" y="110" width="60" height="12" rx="4" fill="#1E1B30"/>
    <rect x="20" y="135" width="60" height="12" rx="4" fill="#1E1B30"/>

    <!-- Products Grid -->
    <g transform="translate(105, 45)">
      <!-- Checkout Card -->
      <rect width="325" height="100" rx="12" fill="url(#card-grad)" stroke="#4F46E5" stroke-width="2"/>
      <text x="20" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white">Stripe Secure Checkout</text>
      <text x="20" y="60" font-family="system-ui, sans-serif" font-size="12" fill="#9CA3AF">Transaction Successful</text>
      
      <!-- Checkmark -->
      <circle cx="280" cy="50" r="20" fill="#10B981"/>
      <path d="M272 50 L278 56 L288 44" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Graphic Card Details -->
      <g transform="translate(0, 115)">
        <rect width="150" height="110" rx="12" fill="#161426" stroke="#312E81" stroke-width="1"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">Orders</text>
        <path d="M20 90 L50 60 L80 80 L130 40" stroke="#EF4444" stroke-width="3" fill="none"/>
        <circle cx="130" cy="40" r="4" fill="#EF4444"/>
      </g>

      <g transform="translate(165, 115)">
        <rect width="160" height="110" rx="12" fill="#161426" stroke="#312E81" stroke-width="1"/>
        <text x="15" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="white">Revenue</text>
        <!-- Bar Chart -->
        <rect x="20" y="50" width="15" height="40" rx="2" fill="#10B981"/>
        <rect x="45" y="40" width="15" height="50" rx="2" fill="#10B981"/>
        <rect x="70" y="60" width="15" height="30" rx="2" fill="#3B82F6"/>
        <rect x="95" y="30" width="15" height="60" rx="2" fill="#8B5CF6"/>
        <rect x="120" y="20" width="15" height="70" rx="2" fill="url(#accent-grad)"/>
      </g>
    </g>
  </g>
</svg>