<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B131F" />
      <stop offset="100%" stop-color="#04080F" />
    </linearGradient>
    <linearGradient id="blue-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="24" fill="url(#bg-grad)" />
  <rect x="1" y="1" width="798" height="448" rx="23" stroke="#1E293B" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Glow effect -->
  <circle cx="400" cy="225" r="220" fill="url(#blue-glow)" filter="blur(60px)"/>

  <!-- Isometric Blueprint grid -->
  <g opacity="0.1" stroke="#00ADD8" stroke-width="1">
    <path d="M 0,75 L 800,75 M 0,150 L 800,150 M 0,225 L 800,225 M 0,300 L 800,300 M 0,375 L 800,375" />
    <path d="M 150,0 L 150,450 M 300,0 L 300,450 M 450,0 L 450,450 M 600,0 L 600,450 M 750,0 L 750,450" />
  </g>

  <!-- Clean Architecture Circular Map -->
  <g transform="translate(400, 225)">
    <!-- Outer Layer: Frameworks & Drivers -->
    <circle cx="0" cy="0" r="160" stroke="#1E293B" stroke-width="2" fill="#0E1726" fill-opacity="0.6"/>
    <circle cx="0" cy="0" r="160" stroke="#00ADD8" stroke-width="3" stroke-dasharray="10 10"/>
    <text x="0" y="-140" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#00ADD8" letter-spacing="2" text-anchor="middle">FRAMEWORKS &amp; DRIVERS</text>
    
    <!-- Third Layer: Interface Adapters -->
    <circle cx="0" cy="0" r="120" stroke="#1E293B" stroke-width="2" fill="#162235" fill-opacity="0.7"/>
    <circle cx="0" cy="0" r="120" stroke="#3B82F6" stroke-width="3" stroke-dasharray="5 5"/>
    <text x="0" y="-100" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3B82F6" letter-spacing="1.5" text-anchor="middle">INTERFACE ADAPTERS</text>

    <!-- Second Layer: Use Cases -->
    <circle cx="0" cy="0" r="80" stroke="#1E293B" stroke-width="2" fill="#1E2E4A" fill-opacity="0.8"/>
    <circle cx="0" cy="0" r="80" stroke="#10B981" stroke-width="3"/>
    <text x="0" y="-62" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#10B981" letter-spacing="1" text-anchor="middle">USE CASES</text>

    <!-- Center Layer: Entities -->
    <circle cx="0" cy="0" r="45" stroke="#1E293B" stroke-width="2" fill="#243C64" />
    <circle cx="0" cy="0" r="45" stroke="#F59E0B" stroke-width="3"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F59E0B" letter-spacing="1" text-anchor="middle">ENTITIES</text>

    <!-- Code flow nodes pointing inside -->
    <path d="M -180 0 L -130 0" stroke="#00ADD8" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 180 0 L 130 0" stroke="#00ADD8" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 0 -180 L 0 -130" stroke="#00ADD8" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M 0 180 L 0 130" stroke="#00ADD8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Go Logo Badge -->
  <g transform="translate(620, 50)">
    <rect width="130" height="40" rx="20" fill="#00ADD8" />
    <text x="65" y="26" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">GOLANG</text>
  </g>
</svg>